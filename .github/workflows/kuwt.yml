name: kuwt-daily

on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    env:
      RESEARCHER_GEMINI: ${{ secrets.RESEARCHER_GEMINI }}
      ENTHUSIAST_GEMINI: ${{ secrets.ENTHUSIAST_GEMINI }}
      TEACHER_GEMINI: ${{ secrets.TEACHER_GEMINI }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python App
        run: python src/main.py
